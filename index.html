<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lego App</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/7ee5f2ba27.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html"><img src="#" alt="Logo Image" id="logo-img"></a>
        </div>
        <div class="search-bar">
            <input type="text" id="user-input" placeholder="Search for a set">
            <button type="button" id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div class="search-menu">
            <button type="button" id="search-by-set-name-btn" data-type="text" data-placeholder="Search for a set" class="search-type-btn active">Search by Set Name</button>
            <button type="button" id="search-by-set-details-btn" data-type="number" data-placeholder="Search for set details. E.g. 42100" class="search-type-btn">Set Details</button>
            <button type="button" id="search-by-set-parts-btn" data-type="number" data-placeholder="Search for set parts. E.g. 42055" class="search-type-btn">Set Parts</button>
        </div>
    </header>
    <main>

    </main>

    <script src="app.js" type="module" defer></script>
</body>
</html>
